name: Release APK

# Flow: git tag v0.1.0 (push) -> pub get -> analyze -> test -> build apk --release
#        -> GitHub Release with APK attached (Releases -> latest -> download APK).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter 3.35.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Restore release keystore (or fall back to debug signing)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/upload-keystore.jks
          EOF
            echo "Release keystore restored from secrets."
          else
            echo "No KEYSTORE_BASE64 secret; release build will use debug signing."
          fi

      - name: Derive version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.0.0-manual.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "build_name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Enable Gradle caching
        uses: gradle/actions/setup-gradle@v3

      - name: Flutter build APK (release)
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.build_name }}
          --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "MusicPlayer-${{ steps.version.outputs.tag }}.apk"
          ls -lh "MusicPlayer-${{ steps.version.outputs.tag }}.apk"

      - name: Create GitHub Release + attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Music Player ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: MusicPlayer-${{ steps.version.outputs.tag }}.apk
