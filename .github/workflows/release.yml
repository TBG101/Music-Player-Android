name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & publish
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.0.0-manual.${GITHUB_RUN_NUMBER}"
          fi
          NAME="${TAG#v}"
          CORE="${NAME%%-*}"                       # strip -beta.1 etc.
          IFS=. read -r MAJOR MINOR PATCH <<< "$CORE"
          # Deterministic versionCode from the tag (0.1.0 -> 100), so it never depends on run numbers or forks
          if [[ "$TAG" == v0.0.0-manual.* ]]; then
            CODE="${GITHUB_RUN_NUMBER}"
          else
            CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          fi
          {
            echo "tag=${TAG}"
            echo "build_name=${NAME}"
            echo "build_number=${CODE}"
            echo "prerelease=$([[ "$NAME" == *-* ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No KEYSTORE_BASE64 secret. APK will be debug-signed and marked as a pre-release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter pub get

      - name: Build release APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.build_name }}
          --build-number=${{ steps.version.outputs.build_number }}

      - name: Name artifacts + checksum
        id: pkg
        run: |
          SUFFIX=""
          [ "${{ steps.signing.outputs.signed }}" = "true" ] || SUFFIX="-debug-signed"
          FILE="Lowwave-${{ steps.version.outputs.tag }}${SUFFIX}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$FILE"
          sha256sum "$FILE" > "$FILE.sha256"
          cat "$FILE.sha256"
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.pkg.outputs.file }}

      - name: Upload build artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.file }}
          path: |
            ${{ steps.pkg.outputs.file }}
            ${{ steps.pkg.outputs.file }}.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Lowwave ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' || steps.signing.outputs.signed != 'true' }}
          files: |
            ${{ steps.pkg.outputs.file }}
            ${{ steps.pkg.outputs.file }}.sha256